name: Validate

# Lints illustration PNGs a PR changes, and runs the pipeline's unit tests when the
# pipeline changes. A lint for honest mistakes, not a security gate: on `pull_request`
# the PR's own copy of this workflow and repo files run, so the real trust boundary is
# human review + branch protection (see CONTRIBUTING.md). Fork-safe: read-only, no secrets.
on:
  pull_request:
    paths:
      - 'illustrations/**'
      - 'pipeline/**'
      - 'scripts/validate.sh'

permissions:
  contents: read

jobs:
  illustrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff changed images
      - run: pip install --quiet -r pipeline/requirements.txt
      - name: Lint changed PNGs
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          mapfile -t pngs < <(git diff --name-only --diff-filter=d "$base" HEAD -- 'illustrations/*.png')
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "no illustration changes"; exit 0
          fi
          printf '%s\n' "${pngs[@]}"
          bash scripts/validate.sh "${pngs[@]}"

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip unless pipeline changed
        id: gate
        run: |
          if git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD -- 'pipeline/**' | grep -q .; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "pipeline unchanged; skipping tests"
          fi
      - if: steps.gate.outputs.run == '1'
        run: pip install --quiet -r pipeline/requirements.txt
      - if: steps.gate.outputs.run == '1'
        working-directory: pipeline
        run: |
          python matte_test.py
          python worker_test.py
